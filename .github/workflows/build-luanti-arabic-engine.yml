name: "Build Arabic-capable Luanti client"

"on":
  push:
    branches:
      - work/arabic-engine-support
    paths:
      - "luanti/code/**"
      - "luanti/5.17.0/fonts/**"
      - "luanti/5.17.0/builtin/locale/**"
      - "tools/validate_luanti_arabic.py"
      - ".github/workflows/build-luanti-arabic-engine.yml"
  pull_request:
    branches:
      - main
    paths:
      - "luanti/code/**"
      - "luanti/5.17.0/fonts/**"
      - ".github/workflows/build-luanti-arabic-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arabic-engine-build-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_BASELINE: ddf0518c31a259dcc359fd4c7bcb1ce8a27e9855

jobs:
  workflow-sanity:
    name: Verify GitHub Actions job scheduling
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm workflow jobs are running
        run: echo "The Arabic engine workflow reached a runner."

  arabic-translation-validation:
    name: Validate Arabic engine catalogs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate built-in Arabic and engine gettext catalogs
        run: python tools/validate_luanti_arabic.py

      - name: Validate engine PO formatting
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gettext
          msgfmt --check --check-format -o "$RUNNER_TEMP/luanti-ar.mo" luanti/code/po/ar/luanti.po

  linux:
    name: Linux x64 build, tests, and install package
    needs: arabic-translation-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install vcpkg host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential curl git pkg-config zip unzip tar ninja-build python3

      - name: Install pinned CMake from PyPI
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install CMake 4.4.4 wheel
        run: |
          python -m pip install --no-cache-dir cmake==4.4.4
          cmake --version
          python -c "import cmake; print('CMake Python package:', cmake.__version__)" 2>/dev/null || true

      - name: Bootstrap pinned vcpkg baseline
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_BASELINE"

          bootstrapped=0
          for attempt in 1 2 3 4; do
            echo "vcpkg bootstrap attempt $attempt/4"
            if "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; then
              bootstrapped=1
              break
            fi
            rm -f "$VCPKG_ROOT/vcpkg"
            if [ "$attempt" -lt 4 ]; then
              delay=$((attempt * 20))
              echo "Bootstrap failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          test "$bootstrapped" -eq 1
          test -x "$VCPKG_ROOT/vcpkg"

      - name: Restore vcpkg binary package cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg/installed
          key: vcpkg-luanti-linux-x64-${{ hashFiles('luanti/code/vcpkg.json') }}-${{ env.VCPKG_BASELINE }}
          restore-keys: |
            vcpkg-luanti-linux-x64-

      - name: Install manifest dependencies
        working-directory: luanti/code
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux

      - name: Configure client and unit tests
        working-directory: luanti/code
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-linux -DCMAKE_BUILD_TYPE=Release -DBUILD_CLIENT=ON -DBUILD_SERVER=OFF -DBUILD_UNITTESTS=ON -DBUILD_DOCUMENTATION=OFF -DENABLE_POSTGRESQL=OFF -DENABLE_CURSES=OFF -DRUN_IN_PLACE=ON

      - name: Build client
        working-directory: luanti/code
        run: cmake --build build --parallel 2

      - name: Run C++ unit tests, including Arabic shaping regressions
        working-directory: luanti/code
        run: ./bin/luanti --run-unittests

      - name: Install and verify portable Linux package
        working-directory: luanti/code
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE/artifacts/linux"
          mkdir -p "$package"
          cmake --install build --prefix "$package"
          test -x "$package/bin/luanti"
          test -s "$package/fonts/NotoSansArabic-Regular.ttf"
          test -s "$package/fonts/NotoSansArabic-OFL.txt"
          tar -czf "$GITHUB_WORKSPACE/artifacts/luanti-arabic-linux-x64.tar.gz" -C "$package" .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: luanti-arabic-linux-x64
          path: artifacts/luanti-arabic-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows x64 MSVC build, tests, and install package
    needs: arabic-translation-validation
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned CMake from PyPI
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CMake 4.4.4 wheel
        shell: pwsh
        run: |
          python -m pip install --no-cache-dir cmake==4.4.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bootstrap pinned vcpkg baseline
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:VCPKG_ROOT" checkout "$env:VCPKG_BASELINE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bootstrapped = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "vcpkg bootstrap attempt $attempt/4"
            Remove-Item "$env:VCPKG_ROOT/vcpkg.exe" -Force -ErrorAction SilentlyContinue
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -eq 0 -and (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
              $bootstrapped = $true
              break
            }
            if ($attempt -lt 4) {
              $delay = 20 * $attempt
              Write-Host "Bootstrap failed; retrying in $delay seconds."
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $bootstrapped) { throw "Could not bootstrap the pinned vcpkg tool after four attempts." }

      - name: Restore vcpkg binary package cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg/installed
          key: vcpkg-luanti-windows-x64-${{ hashFiles('luanti/code/vcpkg.json') }}-${{ env.VCPKG_BASELINE }}
          restore-keys: |
            vcpkg-luanti-windows-x64-

      - name: Install manifest dependencies
        working-directory: luanti/code
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure client and unit tests
        working-directory: luanti/code
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          $cmakeArgs = @("-S", ".", "-B", "build", "-G", "Visual Studio 17 2022", "-A", "x64", "-DCMAKE_TOOLCHAIN_FILE=$toolchain", "-DVCPKG_TARGET_TRIPLET=x64-windows", "-DBUILD_CLIENT=ON", "-DBUILD_SERVER=OFF", "-DBUILD_UNITTESTS=ON", "-DBUILD_DOCUMENTATION=OFF", "-DENABLE_POSTGRESQL=OFF", "-DENABLE_CURSES=OFF", "-DRUN_IN_PLACE=ON")
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build client
        working-directory: luanti/code
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run C++ unit tests, including Arabic shaping regressions
        working-directory: luanti/code
        shell: pwsh
        run: |
          if (-not (Test-Path "bin/Release/luanti.exe")) {
            Get-ChildItem bin -Recurse
            throw "The Luanti client executable was not produced."
          }
          & "bin/Release/luanti.exe" --run-unittests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and verify portable Windows package
        working-directory: luanti/code
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "artifacts/windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          cmake --install build --config Release --prefix $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $package "bin/luanti.exe"))) {
            Get-ChildItem $package -Recurse
            throw "Installed package is missing bin/luanti.exe."
          }
          if (-not (Test-Path (Join-Path $package "fonts/NotoSansArabic-Regular.ttf"))) {
            Get-ChildItem $package -Recurse
            throw "Installed package is missing Noto Sans Arabic."
          }
          if (-not (Test-Path (Join-Path $package "fonts/NotoSansArabic-OFL.txt"))) {
            throw "Installed package is missing the Noto Sans Arabic license."
          }
          $bin = Join-Path $package "bin"
          foreach ($dependency in @("raqm", "harfbuzz", "fribidi")) {
            $dll = Get-ChildItem -Path $bin -Filter "*$dependency*.dll" -File -ErrorAction SilentlyContinue
            if (-not $dll) {
              Get-ChildItem $package -Recurse
              throw "Installed package is missing the $dependency runtime DLL."
            }
          }
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/luanti-arabic-windows-x64.zip"
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath $zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: luanti-arabic-windows-x64
          path: artifacts/luanti-arabic-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
