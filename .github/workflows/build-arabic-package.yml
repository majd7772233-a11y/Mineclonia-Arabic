name: Build Mineclonia Arabic runtime package

on:
  push:
    branches: [main]
    paths:
      - "tools/build_tr_package.py"
      - ".github/workflows/build-arabic-package.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineclonia-arabic-runtime-package
  cancel-in-progress: false

jobs:
  package:
    name: Convert PO to TR and publish install package
    runs-on: ubuntu-latest
    steps:
      - name: Check out Arabic translation workbench
        uses: actions/checkout@v4
        with:
          path: workbench

      - name: Check out pinned Mineclonia source snapshot
        uses: actions/checkout@v4
        with:
          repository: ZenonSeth/mineclonia-mirror
          ref: 4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da
          path: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PO parser
        run: python -m pip install --disable-pip-version-check polib==1.2.0

      - name: Fetch Mineclonia's documented translation tools
        env:
          MTT_DIR: ${{ runner.temp }}/Minetest_Translation_Tools
        run: |
          set -euo pipefail
          git clone --depth 1 https://codeberg.org/Wuzzy/Luanti_Translation_Tools.git "$MTT_DIR"
          echo "MTT_COMMIT=$(git -C "$MTT_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MTT FILE INVENTORY:"
          find "$MTT_DIR" -maxdepth 4 -type f | sort | head -200
          CONVERTER=$(find "$MTT_DIR" -type f -name 'ltt_convert.py' -print -quit)
          CHECKER=$(find "$MTT_DIR" -type f -name 'ltt_check.py' -print -quit)
          echo "=== Converter instructions ==="
          cat "$MTT_DIR/README_ltt_convert.md"
          echo "=== Checker instructions ==="
          cat "$MTT_DIR/README_ltt_check.md"
          python "$CONVERTER" --help || true
          python "$CHECKER" --help || true
          if [ -z "$CONVERTER" ] || [ -z "$CHECKER" ]; then
            echo "Expected ltt_convert.py and ltt_check.py were not found in the renamed repository."
            exit 1
          fi
          echo "MTT_CONVERT=$CONVERTER" >> "$GITHUB_ENV"
          echo "MTT_CHECK=$CHECKER" >> "$GITHUB_ENV"

      - name: Validate source coverage, convert PO to TR, and create ZIP
        env:
          MTT_DIR: ${{ runner.temp }}/Minetest_Translation_Tools
        run: |
          set -euo pipefail
          python workbench/tools/build_tr_package.py \
            --source-root source \
            --mtt-convert "$MTT_CONVERT" \
            --mtt-check "$MTT_CHECK" \
            --source-commit 4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da \
            --expected-files 163 \
            --expected-messages 4980 \
            --target-release "39603 (reported by owner; exact source match unverified)" \
            --luanti-version "5.17.0 (reported by owner)" \
            --output workbench/dist
          echo "PACKAGE_ZIP=$(find workbench/dist -maxdepth 1 -name '*.zip' -print -quit)" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=$(find workbench/dist -maxdepth 1 -name '*.zip.sha256' -print -quit)" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mineclonia-Arabic-TR-install-package
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_SHA }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish pre-release with install ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ZIP: ${{ env.PACKAGE_ZIP }}
          PACKAGE_SHA: ${{ env.PACKAGE_SHA }}
          MTT_COMMIT: ${{ env.MTT_COMMIT }}
        working-directory: workbench
        run: |
          set -euo pipefail
          TAG="mineclonia-arabic-source-4ba113d1"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          ## Mineclonia Arabic runtime package

          - 163 translation domains, 4,980 translated messages.
          - Generated with Mineclonia's documented `ltt_convert.py --po2tr -r` workflow.
          - Checked with `ltt_check.py -r`.
          - Mineclonia source mirror commit: `4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da`.
          - Minetest Translation Tools commit: `$MTT_COMMIT`.
          - Owner-reported target: Mineclonia `release=39603`, Luanti `5.17.0`; exact source-to-local-build equivalence has not been independently confirmed.
          - The package has not yet been tested in a running Luanti client. It is published as a pre-release candidate for installation testing, not as an upstream-approved Mineclonia release.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE_ZIP" "$PACKAGE_SHA" --clobber
            gh release edit "$TAG" --title "Mineclonia Arabic runtime package" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" "$PACKAGE_ZIP" "$PACKAGE_SHA" \
              --target "$GITHUB_SHA" \
              --title "Mineclonia Arabic runtime package" \
              --notes-file "$NOTES" \
              --prerelease
          fi
