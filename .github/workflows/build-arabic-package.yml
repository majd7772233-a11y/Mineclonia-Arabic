name: Build Mineclonia Arabic runtime package

on:
  push:
    branches: [main]
    paths:
      - "mods/**/*.ar.po"
      - "tools/build_tr_package.py"
      - "tools/ENABLE_ARABIC_LANGUAGE.ps1"
      - "tools/ENABLE_ARABIC_LANGUAGE.bat"
      - "tools/tests/Test-EnableArabicLanguage.ps1"
      - ".github/workflows/build-arabic-package.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineclonia-arabic-runtime-package-v7
  cancel-in-progress: true

# Keep only one active package build; this commit refreshes a stalled runner attempt.

jobs:
  test-language-helper:
    name: Test Luanti 5.17.0 Arabic language helper on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Test root and builtin directory selection, enum ordering, repair, and idempotency
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File "tools/tests/Test-EnableArabicLanguage.ps1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    needs: test-language-helper
    name: Convert PO to TR and publish install package
    runs-on: ubuntu-latest
    steps:
      - name: Check out Arabic translation workbench
        uses: actions/checkout@v4
        with:
          path: workbench

      - name: Check out pinned Mineclonia source snapshot
        uses: actions/checkout@v4
        with:
          repository: ZenonSeth/mineclonia-mirror
          ref: 4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da
          path: source

      - name: Check out pinned Luanti modtools
        uses: actions/checkout@v4
        with:
          repository: luanti-org/modtools
          ref: bd16ad824ca0a0baedd43c36525e387f7626f6d1
          path: modtools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a Luanti server for computed-string extraction
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes luanti-server
          SERVER=""
          for candidate in /usr/games/luantiserver /usr/bin/luantiserver /usr/games/minetestserver /usr/bin/minetestserver; do
            if [ -x "$candidate" ]; then SERVER="$candidate"; break; fi
          done
          if [ -z "$SERVER" ]; then
            echo "Could not locate luantiserver/minetestserver after installing luanti-server."
            dpkg -L luanti-server
            exit 1
          fi
          ln -sf "$SERVER" "$RUNNER_TEMP/minetestserver"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/minetestserver" --version

      - name: Install PO parser
        run: python -m pip install --disable-pip-version-check polib==1.2.0

      - name: Fetch Mineclonia's documented translation tools (fallback only if Codeberg is unavailable)
        env:
          LTT_DIR: ${{ runner.temp }}/Luanti_Translation_Tools
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            rm -rf "$LTT_DIR"
            echo "Cloning Luanti Translation Tools (attempt $attempt/3)..."
            if git clone --depth 1 https://codeberg.org/Wuzzy/Luanti_Translation_Tools.git "$LTT_DIR"; then
              success=1
              break
            fi
            sleep $((attempt * 5))
          done

          if [ "$success" -eq 1 ]; then
            git -C "$LTT_DIR" fetch --depth 1 origin 62c1334537014821920bed5c7e2a11af44f6bfcd
            git -C "$LTT_DIR" checkout 62c1334537014821920bed5c7e2a11af44f6bfcd
            CONVERTER=$(find "$LTT_DIR" -type f -name 'ltt_convert.py' -print -quit)
            CHECKER=$(find "$LTT_DIR" -type f -name 'ltt_check.py' -print -quit)
            if [ -z "$CONVERTER" ] || [ -z "$CHECKER" ]; then
              echo "Luanti Translation Tools checkout is missing ltt_convert.py or ltt_check.py."
              exit 1
            fi
            echo "LTT_COMMIT=$(git -C "$LTT_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"
            echo "CONVERTER_MODE=official-ltt" >> "$GITHUB_ENV"
          else
            echo "::warning::Codeberg unavailable after three attempts; using the repository's explicitly-labelled compatibility fallback."
            CONVERTER="$GITHUB_WORKSPACE/workbench/tools/ltt_tr_compat.py"
            CHECKER="$CONVERTER"
            test -f "$CONVERTER"
            echo "LTT_COMMIT=not-used-local-fallback" >> "$GITHUB_ENV"
            echo "CONVERTER_MODE=local-compatibility-fallback-not-official-ltt" >> "$GITHUB_ENV"
          fi

          echo "LTT_CONVERT=$CONVERTER" >> "$GITHUB_ENV"
          echo "LTT_CHECK=$CHECKER" >> "$GITHUB_ENV"

      - name: Generate computed Mineclonia translation strings
        run: |
          set -euo pipefail
          chmod +x modtools/mod_translation_updater.py source/tools/generate_translation_strings/generate.sh
          # Luanti enables a Prometheus HTTP listener by default. Give this
          # temporary one-shot world a free loopback port to avoid collisions.
          read -r GAME_PORT PROMETHEUS_PORT < <(python - <<'PY'
          import socket
          selected = []
          for kind in (socket.SOCK_DGRAM, socket.SOCK_STREAM):
              with socket.socket(socket.AF_INET, kind) as sock:
                  sock.bind(("127.0.0.1", 0))
                  selected.append(sock.getsockname()[1])
          print(*selected)
          PY
          )
          printf '\nport = %s\nbind_address = 127.0.0.1\nprometheus_listener_address = 127.0.0.1:%s\nserver_announce = false\n' "$GAME_PORT" "$PROMETHEUS_PORT" >> source/tools/generate_translation_strings/world.conf
          echo "Using temporary loopback game UDP port $GAME_PORT and metrics TCP port $PROMETHEUS_PORT."
          python - <<'PY'
          from pathlib import Path
          script = Path("source/tools/generate_translation_strings/generate.sh")
          content = script.read_text(encoding="utf-8")
          outdated = '"$1" pot #"${mcladir}/mods"\n"$1" po #-r "${mcladir}/mods"'
          current = '"$1" -r "${mcladir}/mods"'
          if outdated not in content:
              raise SystemExit("Unexpected generate.sh body; refusing to patch unknown upstream script")
          script.write_text(content.replace(outdated, current), encoding="utf-8")
          PY
          (
            cd source
            tools/generate_translation_strings/generate.sh "$GITHUB_WORKSPACE/modtools/mod_translation_updater.py"
          )

      - name: Validate source coverage, convert PO to TR, and create ZIP
        env:
          LTT_DIR: ${{ runner.temp }}/Luanti_Translation_Tools
        run: |
          set -euo pipefail
          python workbench/tools/build_tr_package.py \
            --source-root source \
            --mtt-convert "$LTT_CONVERT" \
            --mtt-check "$LTT_CHECK" \
            --source-commit 4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da \
            --expected-files 163 \
            --expected-messages 5009 \
            --target-release "39603 (reported by owner; exact source match unverified)" \
            --luanti-version "5.17.0 (reported by owner)" \
            --output workbench/dist
          ZIP_PATH=$(find workbench/dist -maxdepth 1 -name '*.zip' -print -quit)
          SHA_PATH=$(find workbench/dist -maxdepth 1 -name '*.zip.sha256' -print -quit)
          test -n "$ZIP_PATH" && test -n "$SHA_PATH"
          echo "PACKAGE_ZIP=$(realpath "$ZIP_PATH")" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=$(realpath "$SHA_PATH")" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mineclonia-Arabic-TR-install-package
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_SHA }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish pre-release with install ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ZIP: ${{ env.PACKAGE_ZIP }}
          PACKAGE_SHA: ${{ env.PACKAGE_SHA }}
          LTT_COMMIT: ${{ env.LTT_COMMIT }}
          CONVERTER_MODE: ${{ env.CONVERTER_MODE }}
        working-directory: workbench
        run: |
          set -euo pipefail
          TAG="mineclonia-arabic-source-4ba113d1-language-code-bridge-v7"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          ## Mineclonia Arabic runtime translation package

          - 163 translation modules are covered: 162 canonical <textdomain>.ar.tr files and one native Arabic PO catalog for gettext plural forms.
          - 5,018 translated non-whitespace PO entries are included. One whitespace-only formatting key is intentionally left for the engine.
          - All runtime strings extracted from the pinned Mineclonia snapshot are checked for coverage; every generated TR catalog is round-trip compared with its PO source.
          - Converter: $CONVERTER_MODE. This run uses the pinned Wuzzy Luanti Translation Tools revision $LTT_COMMIT.
          - Mineclonia source mirror commit: 4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da (source README version 0.123.0).
          - Target reported by the owner: Mineclonia release 39603 and Luanti 5.17.0. Exact equivalence between that local game tree and the pinned source snapshot has not been independently verified.
          - The Windows helper is tested on Windows PowerShell 5.1 against the Luanti 5.17.0 enum, option-label layout, configuration path, and MO catalog installation. It repairs malformed arbe entries to canonical ar and accepts the install root or its builtin/bin child. It detects Windows RUN_IN_PLACE from minetest.conf.example and writes minetest.conf beside bin\\luanti.exe in that mode because Luanti bypasses setSystemPaths(); non-portable installations honor LUANTI_USER_PATH / MINETEST_USER_PATH before falling back to %APPDATA%\\Minetest\\minetest.conf. Existing settings and the previous language catalog are backed up before replacement.
          - Critical runtime fix: Luanti 5.17.0 sends gettext("LANG_CODE") to the server during INIT2. Without locale/ar/LC_MESSAGES/luanti.mo defining LANG_CODE = ar, the client sends no language code and the server does not send Mineclonia *.ar.tr files. The ZIP now bundles a minimal GNU MO bridge at luanti-locale/ar/LC_MESSAGES/luanti.mo; the helper installs it into the Luanti root at locale/ar/LC_MESSAGES/luanti.mo. This catalog selects the Arabic game translation stream; it does not translate the Luanti main-menu UI itself.
          - The user Luanti tree shows the install root as %LOCALAPPDATA%\luanti\5.17.0, containing bin\luanti.exe and builtin\settingtypes.txt. The Mineclonia game root is separate and must not be selected for the language-menu patch.
          - Luanti still lacks full RTL layout/shaping for Arabic; the helper does not change engine rendering.
          - The package has not been tested in a running Luanti client. This is a pre-release candidate for installation testing, not an upstream-approved Mineclonia release or a Weblate merge.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE_ZIP" "$PACKAGE_SHA" --clobber
            gh release edit "$TAG" --title "Mineclonia Arabic runtime package — language-code bridge v7" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" "$PACKAGE_ZIP" "$PACKAGE_SHA" \
              --target "$GITHUB_SHA" \
              --title "Mineclonia Arabic runtime package — language-code bridge v7" \
              --notes-file "$NOTES" \
              --prerelease
          fi
