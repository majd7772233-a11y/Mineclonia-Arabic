name: Build Mineclonia Arabic runtime package

on:
  push:
    branches: [main]
    paths:
      - "mods/**/*.ar.po"
      - "tools/build_tr_package.py"
      - ".github/workflows/build-arabic-package.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mineclonia-arabic-runtime-package
  cancel-in-progress: false

jobs:
  package:
    name: Convert PO to TR and publish install package
    runs-on: ubuntu-latest
    steps:
      - name: Check out Arabic translation workbench
        uses: actions/checkout@v4
        with:
          path: workbench

      - name: Check out pinned Mineclonia source snapshot
        uses: actions/checkout@v4
        with:
          repository: ZenonSeth/mineclonia-mirror
          ref: 4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da
          path: source

      - name: Check out pinned Luanti modtools
        uses: actions/checkout@v4
        with:
          repository: luanti-org/modtools
          ref: bd16ad824ca0a0baedd43c36525e387f7626f6d1
          path: modtools

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a Luanti server for computed-string extraction
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes luanti-server
          SERVER=""
          for candidate in /usr/games/luantiserver /usr/bin/luantiserver /usr/games/minetestserver /usr/bin/minetestserver; do
            if [ -x "$candidate" ]; then SERVER="$candidate"; break; fi
          done
          if [ -z "$SERVER" ]; then
            echo "Could not locate luantiserver/minetestserver after installing luanti-server."
            dpkg -L luanti-server
            exit 1
          fi
          ln -sf "$SERVER" "$RUNNER_TEMP/minetestserver"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/minetestserver" --version

      - name: Install PO parser
        run: python -m pip install --disable-pip-version-check polib==1.2.0

      - name: Fetch Mineclonia's documented translation tools
        env:
          LTT_DIR: ${{ runner.temp }}/Luanti_Translation_Tools
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3 4 5 6; do
            rm -rf "$LTT_DIR"
            echo "Cloning Luanti Translation Tools (attempt $attempt/6)..."
            if git clone --depth 1 https://codeberg.org/Wuzzy/Luanti_Translation_Tools.git "$LTT_DIR"; then
              success=1
              break
            fi
            sleep $((attempt * 8))
          done
          if [ "$success" -ne 1 ]; then
            echo "Codeberg remained unavailable after six attempts."
            exit 1
          fi
          git -C "$LTT_DIR" fetch --depth 1 origin 62c1334537014821920bed5c7e2a11af44f6bfcd
          git -C "$LTT_DIR" checkout 62c1334537014821920bed5c7e2a11af44f6bfcd
          echo "LTT_COMMIT=$(git -C "$LTT_DIR" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "LTT FILE INVENTORY:"
          find "$LTT_DIR" -maxdepth 4 -type f | sort | head -200
          CONVERTER=$(find "$LTT_DIR" -type f -name 'ltt_convert.py' -print -quit)
          CHECKER=$(find "$LTT_DIR" -type f -name 'ltt_check.py' -print -quit)
          if [ -z "$CONVERTER" ] || [ -z "$CHECKER" ]; then
            echo "Expected ltt_convert.py and ltt_check.py were not found in the renamed repository."
            exit 1
          fi
          echo "LTT_CONVERT=$CONVERTER" >> "$GITHUB_ENV"
          echo "LTT_CHECK=$CHECKER" >> "$GITHUB_ENV"

      - name: Generate computed Mineclonia translation strings
        run: |
          set -euo pipefail
          chmod +x modtools/mod_translation_updater.py source/tools/generate_translation_strings/generate.sh
          python - <<'PY'
          from pathlib import Path
          script = Path("source/tools/generate_translation_strings/generate.sh")
          content = script.read_text(encoding="utf-8")
          outdated = '"$1" pot #"${mcladir}/mods"\n"$1" po #-r "${mcladir}/mods"'
          current = '"$1" -r "${mcladir}/mods"'
          if outdated not in content:
              raise SystemExit("Unexpected generate.sh body; refusing to patch unknown upstream script")
          script.write_text(content.replace(outdated, current), encoding="utf-8")
          PY
          (
            cd source
            tools/generate_translation_strings/generate.sh "$GITHUB_WORKSPACE/modtools/mod_translation_updater.py"
          )

      - name: Validate source coverage, convert PO to TR, and create ZIP
        env:
          LTT_DIR: ${{ runner.temp }}/Luanti_Translation_Tools
        run: |
          set -euo pipefail
          python workbench/tools/build_tr_package.py \
            --source-root source \
            --mtt-convert "$LTT_CONVERT" \
            --mtt-check "$LTT_CHECK" \
            --source-commit 4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da \
            --expected-files 163 \
            --expected-messages 4981 \
            --target-release "39603 (reported by owner; exact source match unverified)" \
            --luanti-version "5.17.0 (reported by owner)" \
            --output workbench/dist
          echo "PACKAGE_ZIP=$(find workbench/dist -maxdepth 1 -name '*.zip' -print -quit)" >> "$GITHUB_ENV"
          echo "PACKAGE_SHA=$(find workbench/dist -maxdepth 1 -name '*.zip.sha256' -print -quit)" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mineclonia-Arabic-TR-install-package
          path: |
            ${{ env.PACKAGE_ZIP }}
            ${{ env.PACKAGE_SHA }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish pre-release with install ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ZIP: ${{ env.PACKAGE_ZIP }}
          PACKAGE_SHA: ${{ env.PACKAGE_SHA }}
          LTT_COMMIT: ${{ env.LTT_COMMIT }}
        working-directory: workbench
        run: |
          set -euo pipefail
          TAG="mineclonia-arabic-source-4ba113d1"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          ## Mineclonia Arabic runtime package

          - 163 translation domains and 4,981 PO/TR entries; all strings from the 163 runtime template.txt catalogs are required to be covered.
          - Generated with the current Luanti Translation Tools CLI: `ltt_convert.py <mods> --po2tr -r`.
          - Checked with `ltt_check.py <mods>`. The build also verifies every generated TR entry round-trips exactly to its PO translation.
          - Mineclonia source mirror commit: `4ba113d1ce7afbc5b480b5b0e41b6c0037c8d8da`.
          - Minetest Translation Tools commit: `$LTT_COMMIT`.
          - Owner-reported target: Mineclonia `release=39603`, Luanti `5.17.0`; exact source-to-local-build equivalence has not been independently confirmed.
          - The upstream LTT converter describes itself as experimental; this build validates generated files with ltt_check.py and compares every generated TR translation against the source PO catalog.
          - Computed strings are extracted by running the pinned Mineclonia source snapshot in Luanti server mode with its translation-dumper mod.
          - The package has not yet been tested in a running Luanti client. It is published as a pre-release candidate for installation testing, not as an upstream-approved Mineclonia release.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE_ZIP" "$PACKAGE_SHA" --clobber
            gh release edit "$TAG" --title "Mineclonia Arabic runtime package" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" "$PACKAGE_ZIP" "$PACKAGE_SHA" \
              --target "$GITHUB_SHA" \
              --title "Mineclonia Arabic runtime package" \
              --notes-file "$NOTES" \
              --prerelease
          fi
