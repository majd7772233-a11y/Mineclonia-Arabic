name: Validate Arabic translations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install translation validators
        run: |
          python -m pip install --disable-pip-version-check polib==1.2.0
          sudo apt-get update
          sudo apt-get install --yes gettext

      - name: Validate PO syntax and gettext headers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            msgfmt --check --check-format --output-file=/dev/null "$file"
          done < <(find mods -type f -name '*.ar.po' -print0)

      - name: Validate Luanti placeholders
        run: python tools/check_po.py
